name: AI381 Lab 2 and Lab 3 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt
          pip install pytest ruff httpx

      - name: Run lint
        run: |
          ruff check --select E9,F63,F7,F82 src/app src/train tests

      - name: Run tests
        run: |
          python -m pytest -v

  lab3-validation:
    name: Lab 3 Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Lab 3 Python files
        run: |
          python -m compileall -q src/train/train_lab3.py
          python -m compileall -q src/train/promote_lab3.py

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f docker-compose.lab3.yml config --quiet

      - name: Build Lab 3 Docker image
        run: |
          docker build -f Dockerfile.lab3 -t ai381-lab3-ci .

  build-scan-push:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, lab3-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set image name and tag
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Save Docker image
        run: |
          docker save -o image.tar "$IMAGE_NAME:$IMAGE_TAG"

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            aquasec/trivy:0.58.1 \
            image --input /work/image.tar --ignorefile /work/.trivyignore \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Show image digest
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:$IMAGE_TAG"
