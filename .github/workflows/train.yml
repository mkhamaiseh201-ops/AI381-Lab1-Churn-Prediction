name: AI381 Lab 3 Champion Training and Promotion Gate

on:
  workflow_dispatch:
    inputs:
      force_block:
        description: "Set true to demonstrate a deliberately blocked promotion"
        required: true
        default: "false"
  push:
    branches: [main]
    paths:
      - "src/train/**"
      - "churn_v2.csv"
      - "requirements-lab3.txt"
      - ".github/workflows/train.yml"

permissions:
  contents: read
  packages: read

jobs:
  train-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lab3.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-lab3.txt

      - name: Require persistent MLflow tracking server
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "Set the GitHub Actions secret MLFLOW_TRACKING_URI to the persistent MLflow tracking server used by the champion registry."
            exit 1
          fi

      - name: Train three candidates and log MLflow evidence
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
        run: python src/train/train_lab3.py

      - name: Compare with champion and apply promotion gate
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          GATE_FORCE_BLOCK: ${{ github.event.inputs.force_block || 'false' }}
          GATE_MIN_F1_GAIN: "0.005"
        run: python src/train/promote_lab3.py

      - name: Upload champion artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
