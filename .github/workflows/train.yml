name: AI381 Lab 3 Champion Training and Promotion Gate

on:
  workflow_dispatch:
    inputs:
      force_block:
        description: "Set true to demonstrate a deliberately blocked promotion"
        required: true
        default: "false"
  push:
    branches: [main]
    paths:
      - "src/train/**"
      - "churn_v2.csv"
      - "requirements-lab3.txt"
      - ".github/workflows/train.yml"

permissions:
  contents: read

jobs:
  train-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lab3.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lab3.txt

      - name: Start MLflow tracking server for this workflow run
        run: |
          mkdir -p "$RUNNER_TEMP/mlflow-artifacts"
          nohup mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri "sqlite:///$RUNNER_TEMP/mlflow.db" \
            --default-artifact-root "file://$RUNNER_TEMP/mlflow-artifacts" \
            > "$RUNNER_TEMP/mlflow-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mlflow-server.pid"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
              echo "MLflow tracking server is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/mlflow-server.log"
          echo "MLflow server did not become ready."
          exit 1

      - name: Train three candidates and log MLflow evidence
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
          GITHUB_SHA: ${{ github.sha }}
        run: python src/train/train_lab3.py

      - name: Compare candidates and apply promotion gate
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
          GITHUB_SHA: ${{ github.sha }}
          GATE_FORCE_BLOCK: ${{ github.event.inputs.force_block || 'false' }}
          GATE_MIN_F1_GAIN: "0.005"
        run: python src/train/promote_lab3.py

      - name: Upload MLflow database and champion artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab3-mlflow-and-champion-${{ github.sha }}
          path: |
            artifacts/
            ${{ runner.temp }}/mlflow.db
            ${{ runner.temp }}/mlflow-artifacts/
          if-no-files-found: warn
